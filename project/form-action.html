<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Confirmation page showing the message details submitted through the Career Compass contact form.">
<meta name="author" content="Olise Ebinum">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<title>Message Received | Career Compass</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet"></noscript>

<link rel="stylesheet" href="styles/style.css">
<script type="module" src="scripts/form-action.js"></script>

<style>
    .form-action-section {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.5rem;
    }
    .form-action-card {
        max-width: 32rem;
        width: 100%;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 2rem;
        box-shadow: var(--shadow-sm);
    }
    .form-action-card h1 {
        font-size: 1.4rem;
        margin: 0 0 0.4rem;
    }
    .form-action-card > p:first-of-type {
        color: var(--text-secondary);
        margin: 0 0 1.5rem;
    }
    .form-action-list {
        list-style: none;
        margin: 0 0 1.75rem;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    .form-action-list dt {
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 0.8rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.2rem;
    }
    .form-action-list dd {
        margin: 0;
        color: var(--text);
        white-space: pre-wrap;
        word-break: break-word;
    }
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 40 40" width="30" height="30">
                    <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2"/>
                    <g class="brand-needle">
                        <path d="M20 6 L24 20 L20 34 L16 20 Z" fill="currentColor"/>
                    </g>
                    <circle cx="20" cy="20" r="2.5" fill="var(--bg)"/>
                </svg>
            </span>
            <span class="brand-name">Career Compass</span>
        </a>
    </div>
</header>

<main id="main-content">
    <section class="form-action-section">
        <div class="form-action-card">
            <h1 id="confirmation-heading">Thanks — your message is ready to send</h1>
            <p>Here's what was submitted through the contact form.</p>

            <dl class="form-action-list">
                <div>
                    <dt>Name</dt>
                    <dd id="output-name"></dd>
                </div>
                <div>
                    <dt>Email</dt>
                    <dd id="output-email"></dd>
                </div>
                <div>
                    <dt>Message</dt>
                    <dd id="output-message"></dd>
                </div>
            </dl>

            <a href="learning-hub.html#contact" class="action-button action-button-primary">Back to Learning Hub</a>
        </div>
    </section>
</main>

<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-col footer-col-meta">
            <p>&copy; <span id="current-year"></span> Career Compass</p>
            <p>Last updated: <span id="last-modified"></span></p>
        </div>
    </div>
</footer>

</body>
</html>
